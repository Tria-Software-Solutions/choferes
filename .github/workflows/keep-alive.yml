name: Keep Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Se ejecuta cada 5 minutos

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        # -f: fail on HTTP errors so a down backend marks the job as failed
        run: curl -sf --retry 2 https://choferesdealquiler.onrender.com/health

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-choferes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-choferes_dev}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-choferes}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-choferes}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_NAME: ${POSTGRES_DB:-choferes_dev}
      # PostgreSQL env vars expected by dist/config/config.js
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-choferes}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATABASE: ${POSTGRES_DB:-choferes_dev}
      PORT: 5000
      # Obligatorio configurar: sin valor deja de arrancar la API
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY no configurada (min 32 chars)}
      JWT_SECRET_KEY_REFRESH: ${JWT_SECRET_KEY_REFRESH:?JWT_SECRET_KEY_REFRESH no configurada}
      # Documentos: bucket S3-compatible (MinIO en local) y editor de oficina.
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-choferes-documentos}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5001/api}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://localhost:8081}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET no configurada}
    depends_on:
      - db
      - storage-init
    ports:
      - "5001:5000"
    restart: unless-stopped

  # Bucket S3-compatible para los binarios de Documentos (misma API que R2/AWS).
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - storage_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  # Crea el bucket una sola vez y termina. Reintenta hasta que MinIO responda.
  storage-init:
    image: minio/mc:latest
    depends_on:
      - storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-choferes-documentos}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://storage:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'esperando a MinIO...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/$$S3_BUCKET;
      echo 'bucket listo';
      exit 0;
      "
    restart: "no"

  # Editor de oficina (Word/Excel/PowerPoint) que abre y guarda .docx/.xlsx/.pptx
  # reales. Necesita ~2 GB de RAM. JWT_SECRET debe coincidir con el del API.
  documentserver:
    image: onlyoffice/documentserver:latest
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET no configurada}
      JWT_HEADER: Authorization
    ports:
      - "8081:80"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      # CRA inyecta REACT_APP_* en build-time; el runtime de nginx no la usa
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001}
    environment:
      NODE_ENV: production
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
